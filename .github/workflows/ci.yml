name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: "0.13.0"
      - run: zig build test --summary all
      - run: zig build
      - run: zig build run
